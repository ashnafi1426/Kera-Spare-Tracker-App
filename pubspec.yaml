name: kera_spare_tracker
description: "Offline-first, multi-tenant mobile app for spare parts owners in Kera, Ethiopia."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local Persistence (Drift / SQLite)
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6

  # Utilities & Localization
  intl: ^0.20.3
  uuid: ^4.6.0
  path: ^1.9.1

  # Connectivity & Background Tasks
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10

  # Security & Hardware Features
  flutter_secure_storage: ^10.3.4
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  share_plus: 13.3.1
  file_picker: 13.1.0

  # Visuals & Reports
  fl_chart: ^1.2.0

  # Remote Backend & Sync
  dio: ^5.8.0+1
  supabase_flutter: ^2.18.3
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic.ttf
