services:
  - type: web
    name: kera-spare-tracker-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "90"
      - key: OFFLINE_MAX_DAYS
        value: "90"
      - key: ADMIN_PHONE
        value: "+251900000000"
      - key: ADMIN_PASSWORD
        value: "AdminPassword123!"
      - key: ADMIN_BUSINESS_NAME
        value: "Kera System Admin"
